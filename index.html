<!DOCTYPE html>
<!--
  工程行內部網站 — 示範 (single-file demo)
  Spec（先寫規格再開工）：
    1. 打卡：手機上/下班打卡，記時間+GPS，今日狀態、本週出勤
    2. 派工：工地/任務分配，指派負責人，狀態(待派/進行中/完成)
    3. 回報：選工地+進度%+說明+拍照，回報時間軸
  設計原則：手機優先、底部 tab、工程安全色系(橙/深板岩)、非套版 slop、localStorage 持久化
-->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>示範工程行 · 工務通</title>
<style>
  :root{
    --orange:#F97316; --orange-d:#EA580C; --slate:#0F172A; --slate-2:#1E293B;
    --gray:#64748B; --gray-l:#94A3B8; --line:#E2E8F0; --bg:#F1F5F9; --card:#FFFFFF;
    --green:#16A34A; --green-bg:#DCFCE7; --amber:#D97706; --amber-bg:#FEF3C7;
    --blue:#2563EB; --blue-bg:#DBEAFE; --red:#DC2626;
    --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
    --shadow-l:0 10px 25px rgba(15,23,42,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--slate);color:var(--slate);line-height:1.5;-webkit-font-smoothing:antialiased}
  /* 手機框：桌機置中、像 app */
  #app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);
    display:flex;flex-direction:column;position:relative;box-shadow:var(--shadow-l)}

  /* Header */
  header{background:var(--slate);color:#fff;padding:14px 18px;display:flex;
    align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--orange);
    display:grid;place-items:center;font-weight:800;font-size:17px}
  .brand h1{font-size:15px;font-weight:700;letter-spacing:.5px}
  .brand p{font-size:11px;color:var(--gray-l);font-weight:400}
  .hd-date{font-size:12px;color:var(--gray-l);text-align:right}
  .hd-date b{display:block;font-size:15px;color:#fff}

  /* Main */
  main{flex:1;overflow-y:auto;padding:18px 16px 90px}
  .page{display:none;animation:fade .25s ease}
  .page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .sec-title{font-size:13px;font-weight:700;color:var(--gray);margin:4px 2px 10px;
    text-transform:uppercase;letter-spacing:.6px}

  .card{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}

  /* 打卡 */
  .clock-card{text-align:center;background:linear-gradient(160deg,#1E293B,#0F172A);color:#fff;padding:26px 18px}
  .clock-time{font-size:46px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums}
  .clock-sub{color:var(--gray-l);font-size:13px;margin-top:2px}
  .gps{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:rgba(255,255,255,.08);
    padding:7px 14px;border-radius:20px;font-size:12.5px;color:#CBD5E1}
  .gps .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.25)}

  .status-row{display:flex;gap:12px;margin-bottom:14px}
  .status-box{flex:1;background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);text-align:center}
  .status-box .lbl{font-size:12px;color:var(--gray);margin-bottom:4px}
  .status-box .val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .status-box .val.empty{color:var(--gray-l)}
  .status-box small{font-size:11px;color:var(--gray-l)}

  .btn{display:block;width:100%;border:none;border-radius:14px;padding:17px;font-size:17px;
    font-weight:700;cursor:pointer;transition:transform .1s,opacity .2s;font-family:inherit}
  .btn:active{transform:scale(.98)}
  .btn-in{background:var(--orange);color:#fff;box-shadow:0 6px 16px rgba(249,115,22,.32)}
  .btn-out{background:var(--slate-2);color:#fff}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .btn-ghost{background:#fff;color:var(--slate);border:1.5px solid var(--line);font-size:15px;padding:14px}
  .btn-sm{padding:9px 14px;font-size:13px;border-radius:10px;width:auto;display:inline-block}

  .week{display:flex;justify-content:space-between;margin-top:6px}
  .week .d{text-align:center;flex:1}
  .week .d .dn{font-size:11px;color:var(--gray);margin-bottom:6px}
  .week .d .dc{width:30px;height:30px;border-radius:9px;margin:0 auto;display:grid;place-items:center;
    font-size:12px;font-weight:700;background:#F1F5F9;color:var(--gray-l)}
  .week .d.on .dc{background:var(--green-bg);color:var(--green)}
  .week .d.today .dn{color:var(--orange);font-weight:700}

  /* 通用 list / badge */
  .item{background:var(--card);border-radius:14px;padding:15px;box-shadow:var(--shadow);margin-bottom:11px;
    border-left:4px solid var(--line)}
  .item.s-todo{border-left-color:var(--gray-l)}
  .item.s-doing{border-left-color:var(--blue)}
  .item.s-done{border-left-color:var(--green)}
  .item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .item h3{font-size:15.5px;font-weight:700}
  .item .meta{font-size:12.5px;color:var(--gray);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 14px}
  .item .meta span{display:inline-flex;align-items:center;gap:4px}
  .badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .b-todo{background:#F1F5F9;color:var(--gray)}
  .b-doing{background:var(--blue-bg);color:var(--blue)}
  .b-done{background:var(--green-bg);color:var(--green)}
  .who{width:26px;height:26px;border-radius:50%;background:var(--slate);color:#fff;
    display:inline-grid;place-items:center;font-size:11px;font-weight:700}
  .item .acts{display:flex;gap:8px;margin-top:12px}
  .item .acts .btn-sm{flex:1;text-align:center}

  .progress{height:7px;background:#F1F5F9;border-radius:6px;overflow:hidden;margin-top:11px}
  .progress i{display:block;height:100%;background:var(--orange);border-radius:6px;transition:width .4s}

  /* 回報 timeline */
  .report{background:var(--card);border-radius:14px;padding:15px;box-shadow:var(--shadow);margin-bottom:11px}
  .report .rh{display:flex;justify-content:space-between;font-size:12px;color:var(--gray);margin-bottom:7px}
  .report .rt{font-size:14px}
  .report .rimg{margin-top:10px;border-radius:10px;width:100%;max-height:170px;object-fit:cover;display:block}
  .report .rp{font-size:12px;color:var(--orange-d);font-weight:700;margin-top:8px}

  /* form */
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--gray);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;
    padding:12px 13px;font-size:15px;font-family:inherit;background:#fff;color:var(--slate)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--orange)}
  .field textarea{resize:vertical;min-height:74px}
  .range-val{font-weight:800;color:var(--orange-d)}
  input[type=range]{accent-color:var(--orange);padding:0}
  .photo-prev{margin-top:10px;border-radius:11px;width:100%;max-height:180px;object-fit:cover;display:none}

  /* profile */
  .prof{display:flex;align-items:center;gap:14px;margin-bottom:8px}
  .prof .av{width:58px;height:58px;border-radius:16px;background:var(--orange);color:#fff;
    display:grid;place-items:center;font-size:24px;font-weight:800}
  .prof h2{font-size:18px}.prof p{font-size:13px;color:var(--gray)}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
  .stat-grid .s{background:var(--card);border-radius:14px;padding:15px 8px;text-align:center;box-shadow:var(--shadow)}
  .stat-grid .s b{display:block;font-size:24px;font-weight:800;color:var(--slate)}
  .stat-grid .s span{font-size:11.5px;color:var(--gray)}

  /* bottom nav */
  nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
    background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 6px env(safe-area-inset-bottom);z-index:30}
  nav button{flex:1;background:none;border:none;padding:7px 0;cursor:pointer;color:var(--gray-l);
    font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600}
  nav button svg{width:23px;height:23px;stroke:currentColor;stroke-width:2;fill:none}
  nav button.active{color:var(--orange)}

  /* FAB */
  .fab{position:fixed;bottom:80px;left:50%;transform:translateX(135px);width:54px;height:54px;border-radius:50%;
    background:var(--orange);color:#fff;border:none;font-size:28px;box-shadow:0 8px 20px rgba(249,115,22,.4);
    cursor:pointer;z-index:25;display:none;place-items:center}
  @media(max-width:430px){.fab{transform:translateX(118px)}}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
  .modal.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:430px;border-radius:22px 22px 0 0;padding:20px 18px 26px;
    max-height:88vh;overflow-y:auto;animation:up .28s ease}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet h2{font-size:18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
  .sheet h2 .x{font-size:24px;color:var(--gray-l);cursor:pointer;line-height:1}

  .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--slate);
    color:#fff;padding:12px 22px;border-radius:30px;font-size:14px;font-weight:600;z-index:50;opacity:0;
    transition:.3s;box-shadow:var(--shadow-l);pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{text-align:center;color:var(--gray-l);font-size:13px;padding:30px 0}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo">示</div>
      <div><h1>示範工程行 · 工務通</h1><p id="hello">早安，員工 A 師傅</p></div>
    </div>
    <div class="hd-date"><b id="hd-d">--</b><span id="hd-w">--</span></div>
  </header>

  <main>
    <!-- ============ 打卡 ============ -->
    <section class="page active" id="p-clock">
      <div class="card clock-card">
        <div class="clock-time" id="bigClock">--:--:--</div>
        <div class="clock-sub" id="bigDate">--</div>
        <div class="gps"><span class="dot"></span><span id="gpsTxt">定位中…</span></div>
      </div>

      <div class="status-row">
        <div class="status-box"><div class="lbl">上班打卡</div><div class="val empty" id="inTime">--:--</div><small id="inLoc">尚未打卡</small></div>
        <div class="status-box"><div class="lbl">下班打卡</div><div class="val empty" id="outTime">--:--</div><small id="workHr">—</small></div>
      </div>

      <button class="btn btn-in" id="btnIn" onclick="clockIn()">📍 上班打卡</button>
      <div style="height:10px"></div>
      <button class="btn btn-out" id="btnOut" onclick="clockOut()" disabled>下班打卡</button>

      <div class="card" style="margin-top:16px">
        <div class="sec-title" style="margin:0 0 12px">本週出勤</div>
        <div class="week" id="weekRow"></div>
      </div>
    </section>

    <!-- ============ 派工 ============ -->
    <section class="page" id="p-task">
      <div class="sec-title">今日派工 · <span id="taskCount">0</span> 件</div>
      <div id="taskList"></div>
    </section>

    <!-- ============ 回報 ============ -->
    <section class="page" id="p-report">
      <div class="sec-title">工作回報紀錄</div>
      <div id="reportList"></div>
    </section>

    <!-- ============ 我的 ============ -->
    <section class="page" id="p-me">
      <div class="card">
        <div class="prof"><div class="av">A</div><div><h2>員工 A</h2><p>工地主任 · 示範工號 DEMO-001</p></div></div>
      </div>
      <div class="sec-title">本月統計</div>
      <div class="stat-grid">
        <div class="s"><b id="mDays">0</b><span>出勤天</span></div>
        <div class="s"><b id="mTasks">0</b><span>完成工項</span></div>
        <div class="s"><b id="mReports">0</b><span>回報數</span></div>
      </div>
      <div class="sec-title" style="margin-top:18px">設定</div>
      <div class="card" style="padding:6px 0">
        <button class="btn btn-ghost" style="border:none;border-radius:0;text-align:left;padding:15px 18px" onclick="toast('示範用，無實際功能')">🔔 通知設定</button>
        <button class="btn btn-ghost" style="border:none;border-radius:0;text-align:left;padding:15px 18px;color:var(--red)" onclick="resetDemo()">🗑️ 清除示範資料</button>
      </div>
      <p style="text-align:center;font-size:11px;color:var(--gray-l);margin-top:18px">工務通 v0.1 · 預載資料皆為虛構示範 · 資料存於本機瀏覽器</p>
    </section>
  </main>

  <button class="fab" id="fab" onclick="openSheet()">＋</button>

  <nav>
    <button class="active" data-p="clock" onclick="go('clock',this)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>打卡</button>
    <button data-p="task" onclick="go('task',this)">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>派工</button>
    <button data-p="report" onclick="go('report',this)">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>回報</button>
    <button data-p="me" onclick="go('me',this)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>我的</button>
  </nav>
</div>

<!-- modal sheet -->
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- 資料層 (localStorage) ---------- */
const DB={
  get:(k,d)=>JSON.parse(localStorage.getItem('wt_'+k)||JSON.stringify(d)),
  set:(k,v)=>localStorage.setItem('wt_'+k,JSON.stringify(v))
};
const todayKey=()=>new Date().toISOString().slice(0,10);
let GPS='示範路 1 號 · 示範座標 0.0000, 0.0000（非實際定位）';

function seed(){
  if(!DB.get('tasks',null)){
    DB.set('tasks',[
      {id:1,site:'示範路 1 號 — 3F 鋼筋綁紮',who:'B',whoN:'員工 B',hr:'8h',status:'doing',prog:45},
      {id:2,site:'示範路 2 號 — 水電配管',who:'C',whoN:'員工 C',hr:'6h',status:'todo',prog:0},
      {id:3,site:'示範路 3 號 — 模板拆除',who:'A',whoN:'員工 A',hr:'4h',status:'todo',prog:0},
      {id:4,site:'示範路 1 號 — 1F 防水層',who:'D',whoN:'員工 D',hr:'5h',status:'done',prog:100}
    ]);
  }
  if(!DB.get('reports',null)){
    DB.set('reports',[
      {id:1,site:'示範路 1 號 — 1F 防水層',time:'今天 09:42',prog:100,text:'防水層施作完成，已通過自主檢查，明日可進行保護層。',who:'員工 D'},
      {id:2,site:'示範路 1 號 — 3F 鋼筋綁紮',time:'今天 08:15',prog:45,text:'東側鋼筋已綁紮約一半，鋼筋進場數量無誤，續做西側。',who:'員工 B'}
    ]);
  }
}

/* ---------- 導覽 ---------- */
function go(p,el){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.getElementById('p-'+p).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('fab').style.display=(p==='task'||p==='report')?'grid':'none';
  curPage=p;
}
let curPage='clock';

/* ---------- 時鐘 + 日期 ---------- */
const W=['日','一','二','三','四','五','六'];
function tick(){
  const n=new Date();
  document.getElementById('bigClock').textContent=n.toTimeString().slice(0,8);
  document.getElementById('bigDate').textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 星期${W[n.getDay()]}`;
  document.getElementById('hd-d').textContent=`${n.getMonth()+1}/${n.getDate()}`;
  document.getElementById('hd-w').textContent='星期'+W[n.getDay()];
  const h=n.getHours();
  document.getElementById('hello').textContent=(h<12?'早安':h<18?'午安':'晚安')+'，員工 A 師傅';
}

/* ---------- GPS ---------- */
function initGPS(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>{GPS=`已定位 · ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;document.getElementById('gpsTxt').textContent=GPS;},
      ()=>{document.getElementById('gpsTxt').textContent=GPS;}
    );
  }else document.getElementById('gpsTxt').textContent=GPS;
}

/* ---------- 打卡 ---------- */
function renderClock(){
  const rec=DB.get('clock',{})[todayKey()]||{};
  const inT=document.getElementById('inTime'),outT=document.getElementById('outTime');
  if(rec.in){inT.textContent=rec.in;inT.classList.remove('empty');document.getElementById('inLoc').textContent='✓ 已打卡';
    document.getElementById('btnIn').disabled=true;document.getElementById('btnOut').disabled=false;}
  else{inT.textContent='--:--';inT.classList.add('empty');document.getElementById('inLoc').textContent='尚未打卡';
    document.getElementById('btnIn').disabled=false;document.getElementById('btnOut').disabled=true;}
  if(rec.out){outT.textContent=rec.out;outT.classList.remove('empty');
    document.getElementById('btnOut').disabled=true;
    const[h1,m1]=rec.in.split(':').map(Number),[h2,m2]=rec.out.split(':').map(Number);
    const mins=(h2*60+m2)-(h1*60+m1);document.getElementById('workHr').textContent=`工時 ${(mins/60).toFixed(1)} 小時`;
  }else{outT.textContent='--:--';outT.classList.add('empty');document.getElementById('workHr').textContent='—';}
  renderWeek();
}
function renderWeek(){
  const clk=DB.get('clock',{}),row=document.getElementById('weekRow');
  const now=new Date(),mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
  row.innerHTML='';
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const k=d.toISOString().slice(0,10),on=clk[k]&&clk[k].in,isT=k===todayKey();
    row.innerHTML+=`<div class="d ${on?'on':''} ${isT?'today':''}"><div class="dn">${W[d.getDay()]}</div><div class="dc">${on?'✓':d.getDate()}</div></div>`;
  }
}
function clockIn(){
  const c=DB.get('clock',{});c[todayKey()]={in:new Date().toTimeString().slice(0,5)};DB.set('clock',c);
  renderClock();toast('✅ 上班打卡成功 '+c[todayKey()].in);
}
function clockOut(){
  const c=DB.get('clock',{});if(!c[todayKey()])return;
  c[todayKey()].out=new Date().toTimeString().slice(0,5);DB.set('clock',c);
  renderClock();toast('👋 下班打卡成功，辛苦了！');
}

/* ---------- 派工 ---------- */
const ST={todo:['待派工','b-todo','s-todo'],doing:['進行中','b-doing','s-doing'],done:['已完成','b-done','s-done']};
function renderTasks(){
  const ts=DB.get('tasks',[]),box=document.getElementById('taskList');
  document.getElementById('taskCount').textContent=ts.length;
  if(!ts.length){box.innerHTML='<div class="empty">尚無派工，點右下＋新增</div>';return;}
  box.innerHTML=ts.map(t=>{
    const[lbl,bc,sc]=ST[t.status];
    const next=t.status==='todo'?`<button class="btn-ghost btn-sm" onclick="advance(${t.id})">開始施工</button>`
      :t.status==='doing'?`<button class="btn-ghost btn-sm" onclick="advance(${t.id})">標記完成</button>`:'';
    return `<div class="item ${sc}"><div class="top"><h3>${t.site}</h3><span class="badge ${bc}">${lbl}</span></div>
      <div class="meta"><span><span class="who">${t.who}</span>${t.whoN}</span><span>⏱ ${t.hr}</span></div>
      <div class="progress"><i style="width:${t.prog}%"></i></div>
      ${next?`<div class="acts">${next}</div>`:''}</div>`;
  }).join('');
}
function advance(id){
  const ts=DB.get('tasks',[]),t=ts.find(x=>x.id===id);
  if(t.status==='todo'){t.status='doing';t.prog=10;toast('▶️ 已開始施工');}
  else if(t.status==='doing'){t.status='done';t.prog=100;toast('✅ 工項完成');}
  DB.set('tasks',ts);renderTasks();renderStats();
}

/* ---------- 回報 ---------- */
function renderReports(){
  const rs=DB.get('reports',[]),box=document.getElementById('reportList');
  if(!rs.length){box.innerHTML='<div class="empty">尚無回報，點右下＋新增</div>';return;}
  box.innerHTML=rs.map(r=>`<div class="report"><div class="rh"><b>${r.site}</b><span>${r.time}</span></div>
    <div class="rt">${r.text}</div>${r.img?`<img class="rimg" src="${r.img}">`:''}
    <div class="rp">進度 ${r.prog}% · ${r.who}</div></div>`).join('');
}

/* ---------- 新增 (FAB → sheet) ---------- */
function openSheet(){curPage==='task'?sheetTask():sheetReport();document.getElementById('modal').classList.add('show');}
function closeSheet(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet();});

function siteOptions(){return DB.get('tasks',[]).map(t=>`<option>${t.site}</option>`).join('');}

function sheetTask(){
  document.getElementById('sheet').innerHTML=`
    <h2>新增派工 <span class="x" onclick="closeSheet()">×</span></h2>
    <div class="field"><label>工地 / 工項</label><input id="f-site" placeholder="例：示範路 1 號 — 5F 灌漿"></div>
    <div class="field"><label>指派給</label><select id="f-who"><option>員工 B</option><option>員工 C</option><option>員工 A</option><option>員工 D</option></select></div>
    <div class="field"><label>預計工時</label><select id="f-hr"><option>2h</option><option>4h</option><option selected>6h</option><option>8h</option></select></div>
    <button class="btn btn-in" onclick="addTask()">確認派工</button>`;
}
function addTask(){
  const s=document.getElementById('f-site').value.trim();if(!s){toast('請輸入工地/工項');return;}
  const who=document.getElementById('f-who').value,ts=DB.get('tasks',[]);
  ts.unshift({id:Date.now(),site:s,who:who[0],whoN:who,hr:document.getElementById('f-hr').value,status:'todo',prog:0});
  DB.set('tasks',ts);renderTasks();closeSheet();toast('✅ 已派工給 '+who);
}

let photoData='';
function sheetReport(){
  photoData='';
  document.getElementById('sheet').innerHTML=`
    <h2>新增回報 <span class="x" onclick="closeSheet()">×</span></h2>
    <div class="field"><label>工地 / 工項</label><select id="r-site">${siteOptions()}</select></div>
    <div class="field"><label>進度 <span class="range-val" id="rv">50</span>%</label>
      <input type="range" id="r-prog" min="0" max="100" value="50" oninput="document.getElementById('rv').textContent=this.value"></div>
    <div class="field"><label>說明</label><textarea id="r-text" placeholder="今日施工內容、遇到的問題…"></textarea></div>
    <div class="field"><label>現場照片</label>
      <button class="btn btn-ghost" onclick="document.getElementById('r-photo').click()">📷 拍照 / 選擇照片</button>
      <input type="file" id="r-photo" accept="image/*" capture="environment" style="display:none" onchange="prevPhoto(this)">
      <img class="photo-prev" id="r-prev"></div>
    <button class="btn btn-in" onclick="addReport()">送出回報</button>`;
}
function prevPhoto(inp){
  const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=e=>{photoData=e.target.result;const p=document.getElementById('r-prev');p.src=photoData;p.style.display='block';};
  rd.readAsDataURL(f);
}
function addReport(){
  const t=document.getElementById('r-text').value.trim();if(!t){toast('請輸入回報說明');return;}
  const rs=DB.get('reports',[]);
  rs.unshift({id:Date.now(),site:document.getElementById('r-site').value,
    time:'今天 '+new Date().toTimeString().slice(0,5),prog:+document.getElementById('r-prog').value,
    text:t,who:'員工 A',img:photoData});
  DB.set('reports',rs);renderReports();renderStats();closeSheet();toast('✅ 回報已送出');
}

/* ---------- 統計 / 工具 ---------- */
function renderStats(){
  const clk=DB.get('clock',{});
  document.getElementById('mDays').textContent=Object.keys(clk).length||0;
  document.getElementById('mTasks').textContent=DB.get('tasks',[]).filter(t=>t.status==='done').length;
  document.getElementById('mReports').textContent=DB.get('reports',[]).length;
}
let tT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2200);}
function resetDemo(){if(confirm('清除所有示範資料？')){localStorage.clear();location.reload();}}

/* ---------- init ---------- */
seed();tick();setInterval(tick,1000);initGPS();
renderClock();renderTasks();renderReports();renderStats();
// 深連結：#task / #report / #me 直接開該分頁
(()=>{const h=location.hash.slice(1);if(h){const b=document.querySelector(`nav button[data-p="${h}"]`);if(b)go(h,b);}})();
</script>
</body>
</html>
